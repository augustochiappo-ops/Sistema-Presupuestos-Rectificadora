<!-- @dsCard group="Colors" viewport="700x150" name="Brand & inverse" subtitle="Pure black ink on white — the monochrome core" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:#fff;padding:20px;display:flex;gap:14px}
.sw{flex:1;border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border:1px solid var(--border-default)}
.n{font-weight:600;font-size:13px}.v{font-size:11px;opacity:.6;font-family:monospace}</style></head>
<body>
<div class="sw" style="background:var(--brand-ink);color:#fff"><span class="n">Ink</span><span class="v">#141619</span></div>
<div class="sw" style="background:var(--neutral-700);color:#fff"><span class="n">Ink 700</span><span class="v">#3a3e47</span></div>
<div class="sw" style="background:var(--brand-contrast);color:#141619"><span class="n">Contrast</span><span class="v">#ffffff</span></div>
</body></html>
