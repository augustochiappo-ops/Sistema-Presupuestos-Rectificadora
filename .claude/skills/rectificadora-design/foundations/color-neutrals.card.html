<!-- @dsCard group="Colors" viewport="700x160" name="Neutral scale" subtitle="White → black ramp for surfaces, text and borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:#fff;padding:20px;display:flex;gap:6px}
.sw{flex:1;border-radius:8px;height:100px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:10px;font-family:monospace;border:1px solid var(--border-subtle)}</style></head>
<body>
<div class="sw" style="background:var(--neutral-0);color:#141619">0</div>
<div class="sw" style="background:var(--neutral-50);color:#141619">50</div>
<div class="sw" style="background:var(--neutral-100);color:#141619">100</div>
<div class="sw" style="background:var(--neutral-200);color:#141619">200</div>
<div class="sw" style="background:var(--neutral-300);color:#141619">300</div>
<div class="sw" style="background:var(--neutral-400);color:#fff">400</div>
<div class="sw" style="background:var(--neutral-500);color:#fff">500</div>
<div class="sw" style="background:var(--neutral-600);color:#fff">600</div>
<div class="sw" style="background:var(--neutral-700);color:#fff">700</div>
<div class="sw" style="background:var(--neutral-800);color:#fff">800</div>
<div class="sw" style="background:var(--neutral-900);color:#fff">900</div>
</body></html>
