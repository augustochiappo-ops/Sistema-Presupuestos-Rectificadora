<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Desk, shell, card, sunken well" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--bg-app);padding:20px;display:flex;gap:14px}
.sw{flex:1;height:100px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;border:1px solid var(--border-default)}
.n{font-weight:600;font-size:12px}.v{font-size:10px;font-family:monospace;color:var(--text-muted)}</style></head>
<body>
<div class="sw" style="background:var(--bg-app)"><span class="n">Desk</span><span class="v">--bg-app</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="n">Card / Shell</span><span class="v">--surface-card</span></div>
<div class="sw" style="background:var(--surface-sunken)"><span class="n">Sunken well</span><span class="v">--surface-sunken</span></div>
<div class="sw" style="background:var(--surface-inverse);color:#fff;border-color:var(--surface-inverse)"><span class="n">Inverse</span><span class="v">--surface-inverse</span></div>
</body></html>
